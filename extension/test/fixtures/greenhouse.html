<!doctype html>
<!-- Synthetic Greenhouse-style application form (job-boards.greenhouse.io). Invented company and questions. -->
<html><head><meta charset="utf-8"><title>Job Application for Data Engineer at Northwind Traders</title></head><body>
<div id="app_body">
  <h1 class="app-title">Data Engineer</h1>
  <form id="application_form" action="/fixture/greenhouse/submit" method="post">
    <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" aria-required="true"></div>
    <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" aria-required="true"></div>
    <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="text" id="email" name="job_application[email]" aria-required="true"></div>
    <div class="field"><label for="phone">Phone</label><input type="text" id="phone" name="job_application[phone]"></div>
    <div class="field"><label for="candidate-location">Location (City)</label><input type="text" id="candidate-location" name="job_application[location]"></div>
    <div class="field"><label>Resume/CV <span class="asterisk">*</span></label><div class="drop-zone"><input type="file" id="resume" name="job_application[resume]" style="display:none"><button type="button">Attach</button></div></div>
    <div class="field"><label for="question_101">LinkedIn Profile</label><input type="text" id="question_101" name="job_application[answers_attributes][0][text_value]"></div>
    <div class="field"><label for="question_102">Website</label><input type="text" id="question_102" name="job_application[answers_attributes][1][text_value]"></div>
    <div class="field"><label for="question_103">Will you now or in the future require sponsorship for employment visa status? <span class="asterisk">*</span></label>
      <select id="question_103" name="job_application[answers_attributes][2][boolean_value]" required><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
    <div class="field"><label for="question_104">Why do you want to work at Northwind Traders? <span class="asterisk">*</span></label><textarea id="question_104" name="job_application[answers_attributes][3][text_value]" required></textarea></div>
    <div class="field"><label for="question_105">How did you hear about this job?</label><input type="text" id="question_105" name="job_application[answers_attributes][4][text_value]"></div>
    <div id="eeoc_fields">
      <div class="field"><label for="job_application_gender">Gender</label><select id="job_application_gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
      <div class="field"><label for="job_application_veteran_status">Veteran Status</label><select id="job_application_veteran_status" name="job_application[veteran_status]"><option value="">Please select</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of a protected veteran</option><option value="3">I don't wish to answer</option></select></div>
    </div>
    <input type="submit" value="Submit Application" id="submit_app">
  </form>
</div>
<script>
  window.__submitted = 0;
  document.getElementById('application_form').addEventListener('submit', function (e) { e.preventDefault(); window.__submitted++; });
</script>
</body></html>
