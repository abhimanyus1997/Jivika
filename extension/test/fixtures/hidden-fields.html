<!doctype html>
<!-- Synthetic form that plants fields the user cannot see: off-screen, transparent and 1px inputs. Invented company. -->
<html><head><meta charset="utf-8"><title>Apply - Contoso Careers</title></head><body>
<h1>Data Analyst</h1>
<form id="apply">
  <label>Full name <input name="name"></label>
  <label style="position:absolute;left:-10000px;top:0">Expected salary <input name="salary"></label>
  <div style="opacity:0;height:1px;overflow:hidden"><label>Ethnicity <input name="ethnicity"></label></div>
  <label>Phone <input name="phone" style="width:1px;height:1px;padding:0;border:0"></label>
  <label><input type="radio" name="relocate" value="Yes" style="opacity:0;position:absolute"> Willing to relocate: Yes</label>
  <label><input type="radio" name="relocate" value="No" style="opacity:0;position:absolute"> No</label>
</form>
</body></html>
