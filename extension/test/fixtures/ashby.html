<!doctype html>
<!-- Synthetic Ashby-style application form (jobs.ashbyhq.com). Invented company and questions. -->
<html><head><meta charset="utf-8"><title>Application - Fabrikam</title></head><body>
<div class="ashby-application-form-container">
  <div class="_fieldEntry_x1"><label for="_systemfield_name" class="ashby-application-form-question-title _required_x2">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" required></div>
  <div class="_fieldEntry_x1"><label for="_systemfield_email" class="ashby-application-form-question-title _required_x2">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" required></div>
  <div class="_fieldEntry_x1"><label for="f3a1" class="ashby-application-form-question-title">Phone Number</label><input id="f3a1" name="f3a1" type="tel"></div>
  <div class="_fieldEntry_x1"><label for="f3a2" class="ashby-application-form-question-title">LinkedIn Profile</label><input id="f3a2" name="f3a2" type="text"></div>
  <div class="_fieldEntry_x1"><label for="f3a3" class="ashby-application-form-question-title">What is your notice period?</label><input id="f3a3" name="f3a3" type="text"></div>
  <div class="_fieldEntry_x1"><label for="f3a4" class="ashby-application-form-question-title">Expected annual compensation</label><input id="f3a4" name="f3a4" type="text"></div>
  <div class="_fieldEntry_x1"><label for="f3a6" class="ashby-application-form-question-title">Years of experience</label><input id="f3a6" name="f3a6" type="number"></div>
  <div class="_fieldEntry_x1"><label class="ashby-application-form-question-title _required_x2">Are you open to relocating to Bengaluru?</label>
    <div class="_yesno_x3"><button type="button" class="_option_x4">Yes</button><button type="button" class="_option_x4">No</button></div></div>
  <div class="_fieldEntry_x1"><label for="_systemfield_resume" class="ashby-application-form-question-title _required_x2">Resume</label><input id="_systemfield_resume" type="file" style="opacity:0;width:1px;height:1px"></div>
  <button type="submit" class="ashby-application-form-submit-button" id="submit">Submit Application</button>
</div>
<script>window.__clicked = 0; document.getElementById('submit').addEventListener('click', function () { window.__clicked++; });</script>
</body></html>
