<!doctype html>
<!-- Synthetic Lever-style application form (jobs.lever.co). Invented company and questions. -->
<html><head><meta charset="utf-8"><title>Contoso - Platform Engineer</title></head><body>
<div class="application-page">
<form id="application-form" method="POST" action="/fixture/lever/apply">
  <h4>Submit your application</h4>
  <ul>
    <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">*</span></div><div class="application-field"><input type="file" name="resume" id="resume-upload-input" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">*</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">*</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current location</div><div class="application-field"><input type="text" name="location"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
  </ul>
  <h4>Links</h4>
  <ul>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  </ul>
  <div class="application-additional">
    <div class="application-question custom-question">
      <div class="application-label"><div class="text">Are you legally authorized to work in India?<span class="required">*</span></div></div>
      <div class="application-field"><ul data-qa="multiple-choice">
        <li><label><input type="radio" name="cards[abc][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
        <li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
      </ul></div>
    </div>
    <div class="application-question custom-question">
      <div class="application-label"><div class="text">I agree to the privacy notice<span class="required">*</span></div></div>
      <div class="application-field"><input type="checkbox" name="cards[abc][field1]" required></div>
    </div>
  </div>
  <div class="eeo-section">
    <label><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></label>
    <label><div class="application-label">Race</div><select name="eeo[race]"><option value="">Select ...</option><option value="Asian">Asian (Not Hispanic or Latino)</option><option value="Decline to self-identify">Decline to self-identify</option></select></label>
  </div>
  <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
</form>
</div>
<script>
  window.__submitted = 0;
  document.getElementById('application-form').addEventListener('submit', function (e) { e.preventDefault(); window.__submitted++; });
</script>
</body></html>
