[project]
name = "jivika"
version = "0.1.0"
description = "Bring-your-own-key career platform for job seekers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pypdf>=5.0",
    "openai>=1.50",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Layout-aware resume parsing (DOCX, image OCR, tables, columns). Heavy (PyTorch); not part of the default install.
docling = ["docling>=2"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
